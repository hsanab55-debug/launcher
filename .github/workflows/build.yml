name: Build Launcher APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Clean conflicting SDK tools
        run: rm -rf /usr/local/lib/android/sdk/cmdline-tools/latest

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "11076708"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 1. Create Gradle Configuration Files
        run: |
          mkdir -p app
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NasiriyahLauncher"
          include(":app")
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.nasiriyah.launcher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.nasiriyah.launcher"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: 2. Create Manifest and Themes
        run: |
          mkdir -p app/src/main/res/values app/src/main/res/drawable
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="لانشر الناصرية"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:resumeWhilePausing="true"
                      android:screenOrientation="portrait"
                      android:stateNotNeeded="true"
                      android:windowSoftInputMode="adjustPan">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

      - name: 3. Create Vector Drawables
        run: |
          cat > app/src/main/res/drawable/ic_apps.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#00000000" android:pathData="M4,4h6v6H4zM14,4h6v6h-6zM4,14h6v6H4zM14,14h6v6h-6z" android:strokeColor="#FFFFFF" android:strokeLineCap="round" android:strokeLineJoin="round" android:strokeWidth="1.8" />
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_camera.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#00000000" android:pathData="M4,8h3l2,-3h6l2,3h3v11H4zM8.5,13a3.5,3.5 0,1 0,7 0a3.5,3.5 0,1 0,-7 0" android:strokeColor="#FFFFFF" android:strokeLineCap="round" android:strokeLineJoin="round" android:strokeWidth="1.8" />
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0D1015" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#00000000" android:pathData="M34,34h16v16h-16zM58,34h16v16h-16zM34,58h16v16h-16zM58,58h16v16h-16z" android:strokeColor="#FFB547" android:strokeLineJoin="round" android:strokeWidth="4" />
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_msg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#00000000" android:pathData="M4,5h16v11H9l-5,4z" android:strokeColor="#FFFFFF" android:strokeLineCap="round" android:strokeLineJoin="round" android:strokeWidth="1.8" />
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_phone.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#00000000" android:pathData="M5,4h4l2,5 -2.5,1.5a11,11 0,0 0,5 5L15,13l5,2v4a2,2 0,0 1,-2 2A16,16 0,0 1,3 6a2,2 0,0 1,2 -2z" android:strokeColor="#FFFFFF" android:strokeLineCap="round" android:strokeLineJoin="round" android:strokeWidth="1.8" />
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_web.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#00000000" android:pathData="M12,3a9,9 0,1 0,0 18a9,9 0,1 0,0 -18zM3,12h18M12,3c3,3 3,15 0,18M12,3c-3,3 -3,15 0,18" android:strokeColor="#FFFFFF" android:strokeLineCap="round" android:strokeLineJoin="round" android:strokeWidth="1.8" />
          </vector>
          EOF

      - name: 4. Create MainActivity.kt
        run: |
          mkdir -p app/src/main/java/com/nasiriyah/launcher
          cat > app/src/main/java/com/nasiriyah/launcher/MainActivity.kt <<'EOF'
          package com.nasiriyah.launcher
          import android.app.Activity
          import android.content.ComponentName
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.LayerDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.provider.MediaStore
          import android.text.Editable
          import android.text.TextUtils
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.GestureDetector
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.InputMethodManager
          import android.widget.BaseAdapter
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.GridView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextClock
          import android.widget.TextView
          import android.widget.Toast
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.time.LocalDate
          import java.time.chrono.HijrahDate
          import java.time.temporal.ChronoField
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale
          import kotlin.concurrent.thread
          import kotlin.math.abs
          import kotlin.math.acos
          import kotlin.math.asin
          import kotlin.math.atan2
          import kotlin.math.cos
          import kotlin.math.floor
          import kotlin.math.roundToInt
          import kotlin.math.sin

          class AppItem(val label: String, val pkg: String, val component: ComponentName, val icon: Drawable)
          class MainActivity : Activity() {
              private val accent = 0xFFFFB547.toInt()
              private val white = 0xFFF2F4F7.toInt()
              private val dim = 0xFF9AA3B2.toInt()
              private val soft = 0xFFB4BCC9.toInt()
              private val match = ViewGroup.LayoutParams.MATCH_PARENT
              private val wrap = ViewGroup.LayoutParams.WRAP_CONTENT
              private lateinit var root: FrameLayout
              private lateinit var homeGrid: LinearLayout
              private lateinit var drawer: FrameLayout
              private lateinit var drawerGrid: GridView
              private lateinit var searchBox: EditText
              private lateinit var adapter: AppAdapter
              private lateinit var dateView: TextView
              private lateinit var hijriView: TextView
              private lateinit var tempView: TextView
              private lateinit var condView: TextView
              private lateinit var prayerName: TextView
              private lateinit var prayerTime: TextView
              private var apps: List<AppItem> = emptyList()
              private var lastWeather = 0L
              private val tick = object : Runnable {
                  override fun run() {
                      updateDates()
                      updatePrayer()
                      root.postDelayed(this, 60000)
                  }
              }
              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()
              private fun glass(r: Int, fill: Int = 0x14FFFFFF): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(fill)
                      cornerRadius = dp(r).toFloat()
                      setStroke(dp(1), 0x28FFFFFF)
                  }
              }
              private fun radial(c: Int, cx: Float, cy: Float): GradientDrawable {
                  return GradientDrawable().apply {
                      gradientType = GradientDrawable.RADIAL_GRADIENT
                      gradientRadius = dp(420).toFloat()
                      setGradientCenter(cx, cy)
                      colors = intArrayOf(c, c and 0x00FFFFFF)
                  }
              }
              private fun label(text: String, size: Float, color: Int, bold: Boolean = false): TextView {
                  val t = TextView(this)
                  t.text = text
                  t.textSize = size
                  t.setTextColor(color)
                  if (bold) t.typeface = Typeface.DEFAULT_BOLD
                  return t
              }
              private fun statusBarH(): Int {
                  val id = resources.getIdentifier("status_bar_height", "dimen", "android")
                  return if (id > 0) resources.getDimensionPixelSize(id) else dp(24)
              }
              private fun navBarH(): Int {
                  val id = resources.getIdentifier("navigation_bar_height", "dimen", "android")
                  val h = if (id > 0) resources.getDimensionPixelSize(id) else 0
                  return minOf(h, dp(48))
              }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.TRANSPARENT
                  window.navigationBarColor = Color.TRANSPARENT
                  @Suppress("DEPRECATION")
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                          View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  buildUi()
                  setContentView(root)
              }
              private fun buildUi() {
                  root = FrameLayout(this)
                  root.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  root.background = LayerDrawable(
                      arrayOf<Drawable>(
                          ColorDrawable(0xFF0D1015.toInt()),
                          radial(0x38FFB547, 0f, 0.08f),
                          radial(0x486366F1, 1f, 0.4f),
                          radial(0x282DD4BF, 0.15f, 0.8f)
                      )
                  )
                  val page = LinearLayout(this)
                  page.orientation = LinearLayout.VERTICAL
                  page.setPadding(dp(20), statusBarH() + dp(16), dp(20), navBarH() + dp(8))
                  root.addView(page, FrameLayout.LayoutParams(match, match))
                  val top = LinearLayout(this)
                  top.orientation = LinearLayout.HORIZONTAL
                  top.gravity = Gravity.CENTER_VERTICAL
                  val clockCol = LinearLayout(this)
                  clockCol.orientation = LinearLayout.VERTICAL
                  val clock = TextClock(this)
                  clock.format12Hour = "h:mm"
                  clock.format24Hour = "h:mm"
                  clock.textSize = 68f
                  clock.setTextColor(white)
                  clock.typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD_ITALIC)
                  clock.textDirection = View.TEXT_DIRECTION_LTR
                  clock.includeFontPadding = false
                  clockCol.addView(clock)
                  dateView = label("", 15f, dim)
                  clockCol.addView(dateView)
                  top.addView(clockCol, LinearLayout.LayoutParams(0, wrap, 1f))
                  val wx = LinearLayout(this)
                  wx.orientation = LinearLayout.VERTICAL
                  wx.gravity = Gravity.CENTER
                  wx.background = glass(22)
                  wx.setPadding(dp(8), dp(10), dp(8), dp(10))
                  tempView = label("--°", 28f, white, true)
                  tempView.typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD_ITALIC)
                  condView = label("الناصرية", 12f, soft)
                  hijriView = label("", 12f, dim)
                  wx.addView(tempView)
                  wx.addView(condView)
                  wx.addView(hijriView)
                  top.addView(wx, LinearLayout.LayoutParams(dp(150), wrap))
                  page.addView(top)
                  val prayer = LinearLayout(this)
                  prayer.orientation = LinearLayout.HORIZONTAL
                  prayer.gravity = Gravity.CENTER_VERTICAL
                  prayer.background = glass(22)
                  prayer.setPadding(dp(16), 0, dp(16), 0)
                  val pLabel = label("الصلاة القادمة", 13f, dim)
                  prayerName = label("", 15f, white, true)
                  prayerName.setPadding(dp(10), 0, 0, 0)
                  prayerTime = label("", 15f, accent, true)
                  prayerTime.textDirection = View.TEXT_DIRECTION_LTR
                  prayer.addView(pLabel)
                  prayer.addView(prayerName)
                  prayer.addView(View(this), LinearLayout.LayoutParams(0, 1, 1f))
                  prayer.addView(prayerTime)
                  val pl = LinearLayout.LayoutParams(match, dp(44))
                  pl.topMargin = dp(14)
                  page.addView(prayer, pl)
                  val search = label("ابحث في الهاتف", 15f, dim)
                  search.gravity = Gravity.CENTER_VERTICAL
                  search.background = glass(24)
                  search.setPadding(dp(20), 0, dp(20), 0)
                  search.setOnClickListener { openDrawer() }
                  val sl = LinearLayout.LayoutParams(match, dp(48))
                  sl.topMargin = dp(14)
                  page.addView(search, sl)
                  homeGrid = LinearLayout(this)
                  homeGrid.orientation = LinearLayout.VERTICAL
                  val gl = LinearLayout.LayoutParams(match, wrap)
                  gl.topMargin = dp(18)
                  page.addView(homeGrid, gl)
                  page.addView(View(this), LinearLayout.LayoutParams(match, 0, 1f))
                  val dock = LinearLayout(this)
                  dock.orientation = LinearLayout.HORIZONTAL
                  dock.gravity = Gravity.CENTER
                  dock.background = glass(32, 0x18FFFFFF)
                  dock.addView(dockTile(R.drawable.ic_phone, false) { go(Intent(Intent.ACTION_DIAL)) }, LinearLayout.LayoutParams(0, wrap, 1f))
                  dock.addView(dockTile(R.drawable.ic_msg, false) { go(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_APP_MESSAGING)) }, LinearLayout.LayoutParams(0, wrap, 1f))
                  dock.addView(dockTile(R.drawable.ic_camera, false) { go(Intent(MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA)) }, LinearLayout.LayoutParams(0, wrap, 1f))
                  dock.addView(dockTile(R.drawable.ic_web, false) { go(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com"))) }, LinearLayout.LayoutParams(0, wrap, 1f))
                  dock.addView(dockTile(R.drawable.ic_apps, true) { openDrawer() }, LinearLayout.LayoutParams(0, wrap, 1f))
                  page.addView(dock, LinearLayout.LayoutParams(match, dp(76)))
                  buildDrawer()
                  val gd = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onDown(e: MotionEvent): Boolean = true
                      override fun onFling(e1: MotionEvent?, e2: MotionEvent, vx: Float, vy: Float): Boolean {
                          if (vy < -1200f && abs(vy) > abs(vx)) {
                              openDrawer()
                              return true
                          }
                          return false
                      }
                  })
                  root.setOnTouchListener { _, ev ->
                      gd.onTouchEvent(ev)
                      true
                  }
              }
              private fun dockTile(res: Int, accented: Boolean, onClick: () -> Unit): View {
                  val box = FrameLayout(this)
                  val tile = ImageView(this)
                  tile.setImageResource(res)
                  tile.setPadding(dp(14), dp(14), dp(14), dp(14))
                  tile.background = glass(19, 0x1AFFFFFF)
                  if (accented) tile.setColorFilter(accent)
                  tile.contentDescription = if (accented) "كل التطبيقات" else "اختصار"
                  tile.setOnClickListener { onClick() }
                  val lp = FrameLayout.LayoutParams(dp(54), dp(54))
                  lp.gravity = Gravity.CENTER
                  box.addView(tile, lp)
                  return box
              }
              private fun buildDrawer() {
                  drawer = FrameLayout(this)
                  drawer.setBackgroundColor(0xF20D1015.toInt())
                  drawer.visibility = View.GONE
                  drawer.isClickable = true
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(dp(20), statusBarH() + dp(16), dp(20), navBarH() + dp(8))
                  val title = label("كل التطبيقات", 28f, white, true)
                  title.setPadding(dp(6), 0, dp(6), 0)
                  col.addView(title)
                  searchBox = EditText(this)
                  searchBox.hint = "ابحث عن تطبيق"
                  searchBox.setHintTextColor(dim)
                  searchBox.setTextColor(white)
                  searchBox.textSize = 15f
                  searchBox.setSingleLine(true)
                  searchBox.background = glass(26)
                  searchBox.setPadding(dp(20), 0, dp(20), 0)
                  searchBox.addTextChangedListener(object : TextWatcher {
                      override fun afterTextChanged(s: Editable?) {
                          val q = s?.toString()?.trim()?.lowercase() ?: ""
                          adapter.items = if (q.isEmpty()) apps else apps.filter { it.label.lowercase().contains(q) }
                          adapter.notifyDataSetChanged()
                      }
                      override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                      override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                  })
                  val sl = LinearLayout.LayoutParams(match, dp(52))
                  sl.topMargin = dp(16)
                  col.addView(searchBox, sl)
                  adapter = AppAdapter()
                  drawerGrid = GridView(this)
                  drawerGrid.numColumns = 4
                  drawerGrid.verticalSpacing = dp(18)
                  drawerGrid.selector = ColorDrawable(Color.TRANSPARENT)
                  drawerGrid.adapter = adapter
                  drawerGrid.setOnItemClickListener { _, _, pos, _ -> launch(adapter.items[pos]) }
                  drawerGrid.setOnItemLongClickListener { _, _, pos, _ ->
                      togglePin(adapter.items[pos])
                      true
                  }
                  val gl = LinearLayout.LayoutParams(match, 0, 1f)
                  gl.topMargin = dp(20)
                  col.addView(drawerGrid, gl)
                  drawer.addView(col, FrameLayout.LayoutParams(match, match))
                  root.addView(drawer, FrameLayout.LayoutParams(match, match))
              }
              private fun openDrawer() {
                  if (drawer.visibility == View.VISIBLE) return
                  drawer.alpha = 0f
                  drawer.visibility = View.VISIBLE
                  drawer.animate().alpha(1f).setDuration(180).start()
              }
              private fun closeDrawer() {
                  if (drawer.visibility != View.VISIBLE) return
                  val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                  imm.hideSoftInputFromWindow(searchBox.windowToken, 0)
                  searchBox.setText("")
                  searchBox.clearFocus()
                  drawer.animate().alpha(0f).setDuration(150).withEndAction {
                      drawer.visibility = View.GONE
                  }.start()
              }
              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (drawer.visibility == View.VISIBLE) closeDrawer()
              }
              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  closeDrawer()
              }
              override fun onResume() {
                  super.onResume()
                  loadApps()
                  root.removeCallbacks(tick)
                  root.post(tick)
                  fetchWeather()
              }
              override fun onPause() {
                  root.removeCallbacks(tick)
                  super.onPause()
              }
              private fun loadApps() {
                  val pm = packageManager
                  val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  apps = pm.queryIntentActivities(i, 0)
                      .map { AppItem(it.loadLabel(pm).toString(), it.activityInfo.packageName, ComponentName(it.activityInfo.packageName, it.activityInfo.name), it.loadIcon(pm)) }
                      .filter { it.pkg != packageName }
                      .sortedBy { it.label.lowercase() }
                  adapter.items = apps
                  adapter.notifyDataSetChanged()
                  refreshHome()
              }
              private fun pins(): Set<String> {
                  val sp = getSharedPreferences("launcher", MODE_PRIVATE)
                  val saved = sp.getStringSet("pins", null)
                  if (saved != null) return saved
                  return apps.take(8).map { it.pkg }.toSet()
              }
              private fun togglePin(a: AppItem) {
                  val cur = pins().toMutableSet()
                  if (cur.contains(a.pkg)) {
                      cur.remove(a.pkg)
                      Toast.makeText(this, "انشال من الرئيسية", Toast.LENGTH_SHORT).show()
                  } else {
                      cur.add(a.pkg)
                      Toast.makeText(this, "انضاف للرئيسية", Toast.LENGTH_SHORT).show()
                  }
                  getSharedPreferences("launcher", MODE_PRIVATE).edit().putStringSet("pins", HashSet(cur)).apply()
                  refreshHome()
              }
              private fun refreshHome() {
                  homeGrid.removeAllViews()
                  val p = pins()
                  val pinned = apps.filter { p.contains(it.pkg) }.take(8)
                  for (row in pinned.chunked(4)) {
                      val r = LinearLayout(this)
                      r.orientation = LinearLayout.HORIZONTAL
                      val rl = LinearLayout.LayoutParams(match, wrap)
                      rl.bottomMargin = dp(14)
                      for (a in row) {
                          val cell = appCell(a)
                          cell.setOnClickListener { launch(a) }
                          cell.setOnLongClickListener {
                              togglePin(a)
                              true
                          }
                          r.addView(cell, LinearLayout.LayoutParams(0, wrap, 1f))
                      }
                      for (k in row.size until 4) {
                          r.addView(View(this), LinearLayout.LayoutParams(0, 1, 1f))
                      }
                      homeGrid.addView(r, rl)
                  }
              }
              private fun appCell(a: AppItem): LinearLayout {
                  val cell = LinearLayout(this)
                  cell.orientation = LinearLayout.VERTICAL
                  cell.gravity = Gravity.CENTER_HORIZONTAL
                  val img = ImageView(this)
                  img.setImageDrawable(a.icon)
                  img.setPadding(dp(8), dp(8), dp(8), dp(8))
                  img.background = glass(20)
                  cell.addView(img, LinearLayout.LayoutParams(dp(60), dp(60)))
                  val t = label(a.label, 12f, soft)
                  t.maxLines = 1
