                  searchBox.setTextColor(white)
                  searchBox.textSize = 15f
                  searchBox.setSingleLine(true)
                  searchBox.background = glass(26)
                  searchBox.setPadding(dp(20), 0, dp(20), 0)
                  searchBox.addTextChangedListener(object : TextWatcher {
                      override fun afterTextChanged(s: Editable?) {
                          val q = s?.toString()?.trim()?.lowercase() ?: ""
                          adapter.items = if (q.isEmpty()) apps else apps.filter { it.label.lowercase().contains(q) }
                          adapter.notifyDataSetChanged()
                      }
                      override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                      override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                  })
                  val sl = LinearLayout.LayoutParams(match, dp(52))
