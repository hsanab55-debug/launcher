                  val lp = FrameLayout.LayoutParams(dp(54), dp(54))
                  lp.gravity = Gravity.CENTER
                  box.addView(tile, lp)
                  return box
              }

              private fun buildDrawer() {
                  drawer = FrameLayout(this)
                  drawer.setBackgroundColor(0xF20D1015.toInt())
                  drawer.visibility = View.GONE
                  drawer.isClickable = true

                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(dp(20), statusBarH() + dp(16), dp(20), navBarH() + dp(8))

                  val title = label("كل التطبيقات", 28f, white, true)
                  title.setPadding(dp(6), 0, dp(6), 0)
                  col.addView(title)

                  searchBox = EditText(this)
                  searchBox.hint = "ابحث عن تطبيق"
                  searchBox.setHintTextColor(dim)
                  searchBox.setTextColor(white)
                  searchBox.textSize = 15f
                  searchBox.setSingleLine(true)
                  searchBox.background = glass(26)
                  searchBox.setPadding(dp(20), 0, dp(20), 0)
                  searchBox.addTextChangedListener(object : TextWatcher {
                      override fun afterTextChanged(s: Editable?) {
                          val q = s?.toString()?.trim()?.lowercase() ?: ""
                          adapter.items = if (q.isEmpty()) apps else apps.filter { it.label.lowercase().contains(q) }
                          adapter.notifyDataSetChanged()
                      }
                      override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                      override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                  })
                  val sl = LinearLayout.LayoutParams(match, dp(52))
                  sl.topMargin = dp(16)
                  col.addView(searchBox, sl)

                  adapter = AppAdapter()
                  drawerGrid = GridView(this)
                  drawerGrid.numColumns = 4
                  drawerGrid.verticalSpacing = dp(18)
                  drawerGrid.selector = ColorDrawable(Color.TRANSPARENT)
                  drawerGrid.adapter = adapter
                  drawerGrid.setOnItemClickListener { _, _, pos, _ ->
                      launch(adapter.items[pos])
                  }
                  drawerGrid.setOnItemLongClickListener { _, _, pos, _ ->
                      togglePin(adapter.items[pos])
                      true
                  }
                  val gl = LinearLayout.LayoutParams(match, 0, 1f)
                  gl.topMargin = dp(20)
                  col.addView(drawerGrid, gl)

                  drawer.addView(col, FrameLayout.LayoutParams(match, match))
                  root.addView(drawer, FrameLayout.LayoutParams(match, match))
              }

              private fun openDrawer() {
                  if (drawer.visibility == View.VISIBLE) return
                  drawer.alpha = 0f
                  drawer.visibility = View.VISIBLE
                  drawer.animate().alpha(1f).setDuration(180).start()
              }

              private fun closeDrawer() {
                  if (drawer.visibility != View.VISIBLE) return
                  val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                  imm.hideSoftInputFromWindow(searchBox.windowToken, 0)
                  searchBox.setText("")
                  searchBox.clearFocus()
                  drawer.animate().alpha(0f).setDuration(150).withEndAction {
                      drawer.visibility = View.GONE
                  }.start()
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (drawer.visibility == View.VISIBLE) closeDrawer()
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  closeDrawer()
              }

              override fun onResume() {
                  super.onResume()
                  loadApps()
                  root.removeCallbacks(tick)
                  root.post(tick)
                  fetchWeather()
              }

              override fun onPause() {
                  root.removeCallbacks(tick)
                  super.onPause()
              }

              // ---------- التطبيقات ----------

              private fun loadApps() {
                  val pm = packageManager
                  val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  apps = pm.queryIntentActivities(i, 0)
                      .map {
                          AppItem(
                              it.loadLabel(pm).toString(),
                              it.activityInfo.packageName,
                              ComponentName(it.activityInfo.packageName, it.activityInfo.name),
                              it.loadIcon(pm)
                          )
                      }
                      .filter { it.pkg != packageName }
                      .sortedBy { it.label.lowercase() }
                  adapter.items = apps
                  adapter.notifyDataSetChanged()
                  refreshHome()
              }

              private fun pins(): Set<String> {
                  val sp = getSharedPreferences("launcher", MODE_PRIVATE)
                  val saved = sp.getStringSet("pins", null)
                  if (saved != null) return saved
                  return apps.take(8).map { it.pkg }.toSet()
              }

              private fun togglePin(a: AppItem) {
                  val cur = pins().toMutableSet()
                  if (cur.contains(a.pkg)) {
                      cur.remove(a.pkg)
                      Toast.makeText(this, "انشال من الرئيسية", Toast.LENGTH_SHORT).show()
                  } else {
                      cur.add(a.pkg)
                      Toast.makeText(this, "انضاف للرئيسية", Toast.LENGTH_SHORT).show()
                  }
                  getSharedPreferences("launcher", MODE_PRIVATE).edit().putStringSet("pins", HashSet(cur)).apply()
                  refreshHome()
              }

              private fun refreshHome() {
                  homeGrid.removeAllViews()
                  val p = pins()
                  val pinned = apps.filter { p.contains(it.pkg) }.take(8)
                  for (row in pinned.chunked(4)) {
                      val r = LinearLayout(this)
                      r.orientation = LinearLayout.HORIZONTAL
                      val rl = LinearLayout.LayoutParams(match, wrap)
                      rl.bottomMargin = dp(14)
                      for (a in row) {
                          val cell = appCell(a)
                          cell.setOnClickListener { launch(a) }
                          cell.setOnLongClickListener {
                              togglePin(a)
                              true
                          }
                          r.addView(cell, LinearLayout.LayoutParams(0, wrap, 1f))
                      }
                      for (k in row.size until 4) {
                          r.addView(View(this), LinearLayout.LayoutParams(0, 1, 1f))
                      }
                      homeGrid.addView(r, rl)
                  }
              }

              private fun appCell(a: AppItem): LinearLayout {
                  val cell = LinearLayout(this)
                  cell.orientation = LinearLayout.VERTICAL
                  cell.gravity = Gravity.CENTER_HORIZONTAL
                  val img = ImageView(this)
                  img.setImageDrawable(a.icon)
                  img.setPadding(dp(8), dp(8), dp(8), dp(8))
                  img.background = glass(20)
                  cell.addView(img, LinearLayout.LayoutParams(dp(60), dp(60)))
                  val t = label(a.label, 12f, soft)
                  t.maxLines = 1
                  t.ellipsize = TextUtils.TruncateAt.END
                  t.gravity = Gravity.CENTER
                  val tl = LinearLayout.LayoutParams(match, wrap)
                  tl.topMargin = dp(6)
                  cell.addView(t, tl)
                  return cell
              }

              private fun launch(a: AppItem) {
                  val i = Intent(Intent.ACTION_MAIN)
                      .addCategory(Intent.CATEGORY_LAUNCHER)
                      .setComponent(a.component)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED)
                  go(i)
                  closeDrawer()
              }

              private fun go(i: Intent) {
                  try {
                      startActivity(i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  } catch (e: Exception) {
                      Toast.makeText(this, "ما كدرت أفتح التطبيق", Toast.LENGTH_SHORT).show()
                  }
              }

              inner class AppAdapter : BaseAdapter() {
                  var items: List<AppItem> = emptyList()
                  override fun getCount(): Int = items.size
                  override fun getItem(position: Int): Any = items[position]
                  override fun getItemId(position: Int): Long = position.toLong()
                  override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                      val cell = appCell(items[position])
                      cell.isClickable = false
                      cell.isFocusable = false
                      return cell
                  }
              }

              // ---------- التاريخ والصلاة والطقس ----------

              private fun updateDates() {
                  try {
                      dateView.text = SimpleDateFormat("EEEE، d MMMM", Locale("ar", "IQ")).format(Date())
                  } catch (e: Exception) {
                      dateView.text = ""
                  }
                  try {
                      val months = arrayOf(
                          "محرم", "صفر", "ربيع الأول", "ربيع الآخر", "جمادى الأولى", "جمادى الآخرة",
                          "رجب", "شعبان", "رمضان", "شوال", "ذو القعدة", "ذو الحجة"
                      )
                      val h = HijrahDate.now()
                      val m = h.get(ChronoField.MONTH_OF_YEAR)
                      val y = h.get(ChronoField.YEAR)
                      hijriView.text = "${months[m - 1]} $y هـ"
                  } catch (e: Exception) {
                      hijriView.text = ""
                  }
              }

              private fun mod(a: Double, b: Double): Double = ((a % b) + b) % b

              // الناصرية، التوقيت الجعفري تقريباً: الفجر 16°، المغرب 4° تحت الأفق
              // يرجع [الفجر، الشروق، الظهر، المغرب] بالساعات
              private fun prayerTimes(date: LocalDate): DoubleArray {
                  val lat = 31.0439
                  val lon = 46.2573
                  val tz = 3.0
                  val jd0 = date.toEpochDay() + 2440587.5
                  val jd = jd0 + 0.5 - tz / 24.0
                  val d = jd - 2451545.0
                  val g = Math.toRadians(mod(357.529 + 0.98560028 * d, 360.0))
                  val q = mod(280.459 + 0.98564736 * d, 360.0)
                  val l = Math.toRadians(mod(q + 1.915 * sin(g) + 0.020 * sin(2 * g), 360.0))
                  val e = Math.toRadians(23.439 - 0.00000036 * d)
                  val ra = mod(Math.toDegrees(atan2(cos(e) * sin(l), cos(l))) / 15.0, 24.0)
                  val decl = asin(sin(e) * sin(l))
                  val eqt = mod(q / 15.0 - ra + 12.0, 24.0) - 12.0
                  val noon = 12.0 + tz - lon / 15.0 - eqt
                  val la = Math.toRadians(lat)
                  fun hourAngle(angle: Double): Double {
                      val c = (-sin(Math.toRadians(angle)) - sin(la) * sin(decl)) / (cos(la) * cos(decl))
                      return Math.toDegrees(acos(c)) / 15.0
                  }
                  return doubleArrayOf(
                      noon - hourAngle(16.0),
                      noon - hourAngle(0.833),
                      noon,
                      noon + hourAngle(4.0)
                  )
              }

              private fun fmt(h: Double): String {
                  var hh = floor(h).toInt()
                  var mm = ((h - hh) * 60).roundToInt()
                  if (mm == 60) {
                      hh += 1
                      mm = 0
                  }
                  val suffix = if (hh % 24 < 12) "ص" else "م"
                  val h12 = if (hh % 12 == 0) 12 else hh % 12
                  return String.format(Locale.US, "%d:%02d %s", h12, mm, suffix)
              }

              private fun updatePrayer() {
                  val now = Calendar.getInstance()
                  val nowH = now.get(Calendar.HOUR_OF_DAY) + now.get(Calendar.MINUTE) / 60.0
                  val today = LocalDate.now()
                  val t = prayerTimes(today)
                  val names = arrayOf("الفجر", "الظهر", "المغرب")
                  val times = doubleArrayOf(t[0], t[2], t[3])
                  val idx = times.indexOfFirst { it > nowH }
                  val name: String
                  val h: Double
                  if (idx >= 0) {
                      name = names[idx]
                      h = times[idx]
                  } else {
                      name = names[0]
                      h = prayerTimes(today.plusDays(1))[0]
                  }
                  prayerName.text = name
                  prayerTime.text = fmt(h)
              }

              private fun wxText(c: Int): String = when (c) {
                  0 -> "صافي"
                  1, 2 -> "غائم جزئياً"
                  3 -> "غائم"
                  45, 48 -> "ضباب"
                  in 51..57 -> "رذاذ"
                  in 61..67 -> "مطر"
                  in 71..77 -> "ثلج"
                  in 80..82 -> "زخات مطر"
                  in 95..99 -> "عاصفة رعدية"
                  else -> "الناصرية"
              }

              private fun fetchWeather() {
                  if (System.currentTimeMillis() - lastWeather < 600000L) return
                  lastWeather = System.currentTimeMillis()
                  thread {
                      try {
                          val url = URL("https://api.open-meteo.com/v1/forecast?latitude=31.0439&longitude=46.2573&current=temperature_2m,weather_code")
                          val c = url.openConnection() as HttpURLConnection
                          c.connectTimeout = 8000
                          c.readTimeout = 8000
                          val body = c.inputStream.bufferedReader().readText()
                          val cur = JSONObject(body).getJSONObject("current")
                          val temp = cur.getDouble("temperature_2m").roundToInt()
                          val code = cur.getInt("weather_code")
                          runOnUiThread {
                              tempView.text = "$temp°"
                              condView.text = wxText(code)
                          }
                      } catch (e: Exception) {
                          lastWeather = 0L
                      }
                  }
              }
          }
