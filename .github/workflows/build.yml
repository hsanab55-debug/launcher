                  in 71..77 -> "ثلج"
                  in 80..82 -> "زخات مطر"
                  in 95..99 -> "عاصفة رعدية"
                  else -> "الناصرية"
              }

              private fun fetchWeather() {
                  if (System.currentTimeMillis() - lastWeather < 600000L) return
                  lastWeather = System.currentTimeMillis()
                  thread {
                      try {
                          val url = URL("https://api.open-meteo.com/v1/forecast?latitude=31.0439&longitude=46.2573&current=temperature_2m,weather_code")
                          val c = url.openConnection() as HttpURLConnection
                          c.connectTimeout = 8000
                          c.readTimeout = 8000
                          val body = c.inputStream.bufferedReader().readText()
                          val cur = JSONObject(body).getJSONObject("current")
                          val temp = cur.getDouble("temperature_2m").roundToInt()
                          val code = cur.getInt("weather_code")
                          runOnUiThread {
                              tempView.text = "$temp°"
                              condView.text = wxText(code)
                          }
                      } catch (e: Exception) {
