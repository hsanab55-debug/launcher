                  fun hourAngle(angle: Double): Double {
                      val c = (-sin(Math.toRadians(angle)) - sin(la) * sin(decl)) / (cos(la) * cos(decl))
                      return Math.toDegrees(acos(c)) / 15.0
                  }
                  return doubleArrayOf(noon - hourAngle(16.0), noon - hourAngle(0.833), noon, noon + hourAngle(4.0))
              }
              private fun fmt(h: Double): String {
                  var hh = floor(h).toInt()
                  var mm = ((h - hh) * 60).roundToInt()
                  if (mm == 60) {
