                      mm = 0
                  }
                  val suffix = if (hh % 24 < 12) "ص" else "م"
                  val h12 = if (hh % 12 == 0) 12 else hh % 12
                  return String.format(Locale.US, "%d:%02d %s", h12, mm, suffix)
              }
